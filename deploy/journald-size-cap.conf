# Install to /etc/systemd/journald.conf.d/00-size-cap.conf
#
# Without an explicit cap journald defaults to 10% of the filesystem, which is
# ~2.4G on this 24G disk, and it only reclaims space when it hits that ceiling.
# The bot's own output bypasses the journal (the unit uses StandardOutput=append:)
# so this bounds everything else on the box.

[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=1month
